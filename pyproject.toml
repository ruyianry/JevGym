[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevgym"
version = "0.1.0"
description = "JevArena: a timestamped Kalshi benchmark + arena for Jev-style System One decision models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }  # source-available, non-commercial; commercial license available
authors = [{ name = "JevArena authors" }]
keywords = ["prediction-markets", "kalshi", "forecasting", "benchmark", "system-one", "jev", "calibration"]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
hf = [
    "datasets>=2.19",
    "pyarrow>=15",
    "huggingface-hub>=0.23",
]
llm = [
    "anthropic>=0.40",
    "openai>=1.40",
]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
jevgym = "jevgym.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jevgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
